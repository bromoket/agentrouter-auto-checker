<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#1d1730">
    <link rel="icon" type="image/svg+xml" href="/observatory/favicon.svg">
    <title>Sign In · AI Fleet Observatory</title>
    <script src="/observatory/canonical.js"></script>
    <link rel="stylesheet" href="./login.css">
    <script src="./login.js" defer></script>
  </head>
  <body>
    <div class="card">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32">
          <defs>
            <linearGradient id="eye-lg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#8b5cf6"/>
              <stop offset="0.45" stop-color="#c084fc"/>
              <stop offset="0.8" stop-color="#e879f9"/>
              <stop offset="1" stop-color="#f472b6"/>
            </linearGradient>
          </defs>
          <path d="M3.2 16C6.6 9 11.3 7 16 7s9.4 2 12.8 9c-3.4 7-8.1 9-12.8 9S6.6 23 3.2 16Z" fill="none" stroke="url(#eye-lg)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="16" cy="16" r="5.4" fill="url(#eye-lg)"/>
          <circle cx="18.1" cy="13.9" r="1.7" fill="#fff" opacity="0.92"/>
        </svg>
      </div>
      <h1>AI Fleet Observatory</h1>
      <p class="subtitle">Enter your API key to access the dashboard.</p>
      <form id="login-form" autocomplete="off">
        <div class="form-group">
          <label for="api-key">API Key</label>
          <input
            type="password"
            id="api-key"
            name="apiKey"
            required
            autocomplete="current-password"
            placeholder="••••••••••••••••••••••••••••••••"
          />
        </div>
        <button type="submit" id="submit-btn">Sign In</button>
        <div id="error" class="error-msg" role="alert" aria-live="polite"></div>
      </form>
      <p class="hint">Lost your key? Ask the owner Telegram bot with <code>/key</code>.</p>
    </div>
  </body>
</html>
